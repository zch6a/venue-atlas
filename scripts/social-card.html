<!doctype html>
<!-- The repository's social preview (1280×640): docs/social-preview.png, rendered from this page with headless Chrome
     (chrome --headless --screenshot --window-size=1280,640). The map is a crop of docs/site.png, the real site. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(1100px 700px at 12% 8%, #1a2440 0%, #10141b 55%, #0b0d11 100%); color: #e6edf3;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 430px 1fr; gap: 36px;
    padding: 0 48px 0 70px; box-sizing: border-box; align-items: center; }
  h1 { font-size: 62px; margin: 0 0 16px; letter-spacing: -1.5px; }
  h1 span { color: #7c9bff; }
  .tag { font-size: 31px; line-height: 1.22; margin: 0 0 22px; font-weight: 600; }
  .sub { font-size: 18.5px; line-height: 1.5; color: #b1bac4; margin: 0 0 26px; }
  .pills { display: flex; gap: 9px; flex-wrap: wrap; }
  .pills span { font-size: 14.5px; border: 1px solid #30363d; background: #161b22; border-radius: 999px; padding: 6px 12px; color: #c9d1d9; }
  .shot { border-radius: 12px; overflow: hidden; border: 1px solid #30363d; box-shadow: 0 26px 70px rgba(0,0,0,.55); height: 520px; background: #f7f7f5; }
  .shot img { width: 1180px; margin: -68px 0 0 -112px; display: block; }
</style>
</head>
<body>
  <div>
    <h1>venue-<span>atlas</span></h1>
    <p class="tag">What a conference was about, year by year.</p>
    <p class="sub">60,000 papers from seven venues on maps by meaning, in named topics with their share of every year. Search by meaning, in your browser; abstracts read, not kept.</p>
    <div class="pills"><span>ICLR · NeurIPS · ICML · CVPR</span><span>ACL · EMNLP · NAACL</span><span>Static site</span></div>
  </div>
  <div class="shot"><img src="../docs/site.png" alt=""></div>
</body>
</html>
