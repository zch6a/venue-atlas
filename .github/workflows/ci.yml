name: CI
on: [push, pull_request]
# Read-only: tests need no write access.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
        with:
          python-version: ${{ matrix.python }}
      # No test reaches the network: made-up schedule files and a stand-in model
      # --locked: a uv.lock that no longer matches pyproject.toml fails here, not in the monthly build
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
  # The wheel, built from the source archive as an installer would: it carries the page (so `venue-atlas build` writes
  # a whole site), and a clean install runs with numpy as its only dependency.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
      - run: uv build
      - name: The wheel carries the page
        run: |
          for f in index.html app.js style.css tokenizer.js; do
            unzip -l dist/*.whl | grep -q "venue_atlas/site/$f" || { echo "the wheel has no site/$f" >&2; exit 1; }
          done
      - name: A clean install runs
        run: |
          uv venv --python 3.10 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          "$RUNNER_TEMP/clean/bin/venue-atlas" --version
          "$RUNNER_TEMP/clean/bin/python" -c "import importlib.metadata as m; r = m.requires('venue-atlas'); assert r == ['numpy>=1.24'], r"
  # The site's tokenizer against the Python tokenizer's output (tests/fixtures/wordpiece.json)
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "test/*.test.js"
      - run: node --check site/app.js && node --check site/tokenizer.js
