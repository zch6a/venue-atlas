[project]
name = "venue-atlas"
version = "0.1.0"
description = "Maps of the papers accepted at ICLR, NeurIPS, ICML and CVPR: placed by meaning, grouped into named topics with their share by year, searchable by words or by meaning in the browser. A static site, built from each conference's public schedule data; abstracts are not kept."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["research", "papers", "conference", "map", "embeddings", "topics", "iclr", "neurips", "icml", "cvpr", "static-site"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "tokenizers>=0.15"]

[project.urls]
Homepage = "https://github.com/zch6a/venue-atlas"
Site = "https://zch6a.github.io/venue-atlas/"
Issues = "https://github.com/zch6a/venue-atlas/issues"

[project.scripts]
venue-atlas = "venue_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venue_atlas"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "site/data/", "site/model/"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/venue_atlas"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter wraps the code; messages and docs stay whole
